[package]
name = "ikide"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.29"
egui_extras = "0.29"
walkdir = "2"
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Local wall-clock timestamps for the Output log.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Serial monitor. default-features off drops the libudev build dependency so
# the Docker build needs no extra system packages; ports are still openable and
# enumerated via the sysfs fallback.
serialport = { version = "4", default-features = false }
# Scripting engine for user-authored virtual devices (sensors, displays, ...).
# Pure Rust, no C deps; the `sync` feature makes compiled scripts Send so a
# device can live on the simulation thread.
rhai = { version = "1", features = ["sync"] }
# The ik8b compiler, linked as a library so the IDE shares the exact same
# lexer/parser/device table (vendored as a submodule under tools/).
ik8b = { path = "tools/ik8b" }
# The ik8bvm AVR simulator, linked as a library so the IDE runs simulations
ik8bvm = { path = "tools/ik8b/tools/ik8bvm" }
# The MCP server linked as a library to run in-process
ikmcp = { path = "tools/ikmcp" }
# HTTP client for communication with LLM providers
ureq = { version = "2.9", features = ["json"] }
# Interactive terminal: a real PTY plus a VT100/ANSI parser for the screen grid.
portable-pty = "0.8"
vt100 = "0.15"
