[package]
name = "ikide"
version = "0.1.0"
edition = "2026"

[dependencies]
eframe = "0.29"
egui_extras = "0.29"
walkdir = "2"
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The ik8b compiler, linked as a library so the IDE shares the exact same
# lexer/parser/device table (vendored as a submodule under tools/).
ik8b = { path = "tools/ik8b" }
